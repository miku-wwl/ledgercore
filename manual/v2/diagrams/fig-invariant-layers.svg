<text x="574.0" y="117.4" font-size="9.5" fill="#1b2430" text-anchor="middle" font-weight="normal">只读 SQL 重新计算</text>
<rect x="516.0" y="138.0" width="116.0" height="32.0" rx="5.0" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.2"/>
<text x="574.0" y="157.4" font-size="9.5" fill="#1b2430" text-anchor="middle" font-weight="normal">发现即记例外</text>
<rect x="516.0" y="178.0" width="116.0" height="32.0" rx="5.0" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.2"/>
<text x="574.0" y="197.4" font-size="9.5" fill="#1b2430" text-anchor="middle" font-weight="normal">复核通过才可关闭</text>
<text x="14.0" y="238.0" font-size="9.4" fill="#1b2430" text-anchor="start" font-weight="normal">由左到右越来越接近“最后一道防线”：应用层的检查让错误尽早失败，数据库约束让绕过应用的写入也失败，</text>
<text x="14.0" y="250.9" font-size="9.4" fill="#1b2430" text-anchor="start" font-weight="normal">追加式历史让已提交的事实无法被悄悄改写，独立对账则在以上任何一层出错时把差异显性化。</text>
<text x="14.0" y="263.8" font-size="9.4" fill="#1b2430" text-anchor="start" font-weight="normal">第 20 章的 18 个负例逐层验证“被拒绝且有效数据不变”。</text>
