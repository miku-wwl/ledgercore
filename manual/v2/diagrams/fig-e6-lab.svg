<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 318" width="640" height="318" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="12.0" y="19.0" font-size="13" fill="#1b2430" text-anchor="start" font-weight="600">故障注入实验室：真实进程、真实检查点、精确的杀进程与独立评分</text>
<rect x="10.0" y="30.0" width="300.0" height="196.0" rx="7" fill="#f7f9fc" stroke="#b9c6d4" stroke-width="1"/>
<text x="19.0" y="45.0" font-size="10" fill="#46525f" text-anchor="start" font-weight="600">被测银行 JVM（e6-lab 配置）</text>
<rect x="22.0" y="56.0" width="276.0" height="44.0" rx="5.0" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.2"/>
<text x="160.0" y="74.9" font-size="9.6" fill="#1b2430" text-anchor="middle" font-weight="600">启用需同时满足：profile e6-lab、开关为 true、</text>
<text x="160.0" y="88.1" font-size="9.1" fill="#1b2430" text-anchor="middle" font-weight="normal">LEDGERCORE_E6_CONFIRM=DISPOSABLE_ONLY、库名白名单</text>
<rect x="22.0" y="108.0" width="276.0" height="44.0" rx="5.0" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
<text x="160.0" y="126.9" font-size="9.6" fill="#7a1f16" text-anchor="middle" font-weight="600">BlockingCheckpoint：到达故障点</text>
<text x="160.0" y="140.1" font-size="9.1" fill="#7a1f16" text-anchor="middle" font-weight="normal">写 checkpoint.json（PID、故障点、事实）后阻塞</text>
<rect x="22.0" y="160.0" width="276.0" height="54.0" rx="5.0" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.2"/>
<text x="160.0" y="177.3" font-size="9.6" fill="#1d5c38" text-anchor="middle" font-weight="600">普通启动不注册任何钩子</text>
<text x="160.0" y="190.5" font-size="9.1" fill="#1d5c38" text-anchor="middle" font-weight="normal">LedgerCoreApplicationTests 断言</text>
<text x="160.0" y="203.7" font-size="9.1" fill="#1d5c38" text-anchor="middle" font-weight="normal">faultInjectionHookIsAbsent…</text>
<rect x="330.0" y="30.0" width="300.0" height="196.0" rx="7" fill="#fff8ee" stroke="#e6c69a" stroke-width="1"/>
<text x="339.0" y="45.0" font-size="10" fill="#6b3b05" text-anchor="start" font-weight="600">实验 harness（PowerShell）</text>
<rect x="342.0" y="56.0" width="276.0" height="44.0" rx="5.0" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
<text x="480.0" y="74.9" font-size="9.6" fill="#7a1f16" text-anchor="middle" font-weight="600">等待检查点；核对 PID、端口、JAR 哈希</text>
<text x="480.0" y="88.1" font-size="9.1" fill="#7a1f16" text-anchor="middle" font-weight="normal">Stop-Process -Force：杀的正是那个进程</text>
<rect x="342.0" y="108.0" width="276.0" height="44.0" rx="5.0" fill="#e8f5f2" stroke="#0f8a7e" stroke-width="1.2"/>
<text x="480.0" y="126.9" font-size="9.6" fill="#0b4f48" text-anchor="middle" font-weight="600">独立 SQL 评分：不看应用日志、不看 HTTP 码</text>
<text x="480.0" y="140.1" font-size="9.1" fill="#0b4f48" text-anchor="middle" font-weight="normal">NOT_INJECTED 永远不算通过</text>
<rect x="342.0" y="160.0" width="276.0" height="54.0" rx="5.0" fill="#eaf2fb" stroke="#3d7cc9" stroke-width="1.2"/>
<text x="480.0" y="177.3" font-size="9.6" fill="#1b2430" text-anchor="middle" font-weight="600">恢复：无故障配置重启、按例执行</text>
<text x="480.0" y="190.5" font-size="9.1" fill="#1b2430" text-anchor="middle" font-weight="normal">再次独立评分 → restore.json</text>
<text x="480.0" y="203.7" font-size="9.1" fill="#1b2430" text-anchor="middle" font-weight="normal">只停止自己启动的进程</text>
<polyline points="310.0,130.0 326.0,130.0 326.0,78.0 337.0,78.0" fill="none" stroke="#5b6776" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="342.0,78.0 333.1,74.0 333.1,82.0" fill="#5b6776"/>
<polyline points="480.0,100.0 480.0,103.0" fill="none" stroke="#5b6776" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="480.0,108.0 484.0,99.1 476.0,99.1" fill="#5b6776"/>
<polyline points="480.0,152.0 480.0,155.0" fill="none" stroke="#5b6776" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="480.0,160.0 484.0,151.1 476.0,151.1" fill="#5b6776"/>
<rect x="10.0" y="236.0" width="620.0" height="74.0" rx="5.0" fill="#fffbe6" stroke="#d4b106" stroke-width="1.2"/>
<text x="320.0" y="263.0" font-size="10" fill="#5c4a00" text-anchor="middle" font-weight="600">每次运行记录：源码 SHA、trackedTreeDirty、两个 JAR 的 SHA-256、一次性数据库与角色、时间线</text>
<text x="320.0" y="276.6" font-size="9.5" fill="#5c4a00" text-anchor="middle" font-weight="normal">集群 127.0.0.1:55437，库名 ledgercore_e6_&lt;run&gt;；原始目录保留在被忽略的 work/e6-lab/runs/</text>
<text x="320.0" y="290.2" font-size="9.5" fill="#5c4a00" text-anchor="middle" font-weight="normal">E12 实验运行器逐例检查“进程已停、端口已释放”（cleanup 字段）</text>
</svg>
