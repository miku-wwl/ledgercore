<text x="14.0" y="344.0" font-size="9.2" fill="#5b6776" text-anchor="start" font-weight="normal">ClearingCallbackLifecyclePostgresIntegrationTests 在真实 PostgreSQL 上逐条执行并断言恰好这五类例外。</text>
