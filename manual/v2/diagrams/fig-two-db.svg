<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="12.0" y="19.0" font-size="13" fill="#1b2430" text-anchor="start" font-weight="600">两个系统、两个数据库：唯一的接口是签名的 HTTP</text>
<rect x="10.0" y="30.0" width="270.0" height="258.0" rx="7" fill="#f0f8f6" stroke="#a9d6cd" stroke-width="1"/>
<text x="19.0" y="45.0" font-size="10" fill="#0b4f48" text-anchor="start" font-weight="600">银行（LedgerCore）</text>
<rect x="22.0" y="58.0" width="246.0" height="40.0" rx="5.0" fill="#e8f5f2" stroke="#0f8a7e" stroke-width="1.2"/>
<text x="145.0" y="74.8" font-size="10" fill="#0b4f48" text-anchor="middle" font-weight="600">clearing_instructions</text>
<text x="145.0" y="88.4" font-size="9.5" fill="#0b4f48" text-anchor="middle" font-weight="normal">READY → SENT</text>
<rect x="22.0" y="106.0" width="246.0" height="40.0" rx="5.0" fill="#e8f5f2" stroke="#0f8a7e" stroke-width="1.2"/>
<text x="145.0" y="122.8" font-size="10" fill="#0b4f48" text-anchor="middle" font-weight="600">clearing_callback_inbox</text>
<text x="145.0" y="136.4" font-size="9.5" fill="#0b4f48" text-anchor="middle" font-weight="normal">callback_id 与 (operation, sequence) 唯一</text>
<rect x="22.0" y="154.0" width="246.0" height="40.0" rx="5.0" fill="#e8f5f2" stroke="#0f8a7e" stroke-width="1.2"/>
<text x="145.0" y="170.8" font-size="10" fill="#0b4f48" text-anchor="middle" font-weight="600">corporate_payment_intents</text>
<text x="145.0" y="184.4" font-size="9.5" fill="#0b4f48" text-anchor="middle" font-weight="normal">status 与 external_status 分开记录</text>
<rect x="22.0" y="202.0" width="246.0" height="74.0" rx="5.0" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.2"/>
<text x="145.0" y="229.0" font-size="10" fill="#1b2430" text-anchor="middle" font-weight="600">银行库里没有模拟器的表</text>
<text x="145.0" y="242.6" font-size="9.5" fill="#1b2430" text-anchor="middle" font-weight="normal">模拟器的状态只能通过</text>
<text x="145.0" y="256.2" font-size="9.5" fill="#1b2430" text-anchor="middle" font-weight="normal">签名询价得知</text>
<rect x="360.0" y="30.0" width="270.0" height="258.0" rx="7" fill="#fff8ee" stroke="#e6c69a" stroke-width="1"/>
<text x="369.0" y="45.0" font-size="10" fill="#6b3b05" text-anchor="start" font-weight="600">清算模拟器</text>
<rect x="372.0" y="58.0" width="246.0" height="40.0" rx="5.0" fill="#e8f5f2" stroke="#0f8a7e" stroke-width="1.2"/>
<text x="495.0" y="74.8" font-size="10" fill="#0b4f48" text-anchor="middle" font-weight="600">simulator_operations</text>
<text x="495.0" y="88.4" font-size="9.5" fill="#0b4f48" text-anchor="middle" font-weight="normal">operation_id 唯一；事实不可改</text>
<rect x="372.0" y="106.0" width="246.0" height="40.0" rx="5.0" fill="#e8f5f2" stroke="#0f8a7e" stroke-width="1.2"/>
<text x="495.0" y="122.8" font-size="10" fill="#0b4f48" text-anchor="middle" font-weight="600">simulator_callback_outbox</text>
<text x="495.0" y="136.4" font-size="9.5" fill="#0b4f48" text-anchor="middle" font-weight="normal">序号递增；8 次投递预算</text>
<rect x="372.0" y="154.0" width="246.0" height="74.0" rx="5.0" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.2"/>
<text x="495.0" y="181.0" font-size="10" fill="#1b2430" text-anchor="middle" font-weight="600">V3/V5：DEAD 或银行已丢失的</text>
<text x="495.0" y="194.6" font-size="9.5" fill="#1b2430" text-anchor="middle" font-weight="normal">DELIVERED 回调可被询价重新武装</text>
<text x="495.0" y="208.2" font-size="9.5" fill="#1b2430" text-anchor="middle" font-weight="normal">（同一 id、序号、签名载荷）</text>
<polyline points="280.0,78.0 355.0,78.0" fill="none" stroke="#5b6776" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="360.0,78.0 351.1,74.0 351.1,82.0" fill="#5b6776"/>
<rect x="295.4" y="64.5" width="49.2" height="13.5" fill="#ffffff" stroke="none" stroke-width="1" rx="2" opacity="0.86"/>
<text x="320.0" y="73.0" font-size="9.5" fill="#5b6776" text-anchor="middle" font-weight="normal">指令/询价</text>
<polyline points="360.0,126.0 285.0,126.0" fill="none" stroke="#5b6776" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="280.0,126.0 288.9,130.0 288.9,122.0" fill="#5b6776"/>
<rect x="307.5" y="112.5" width="25.0" height="13.5" fill="#ffffff" stroke="none" stroke-width="1" rx="2" opacity="0.86"/>
<text x="320.0" y="121.0" font-size="9.5" fill="#5b6776" text-anchor="middle" font-weight="normal">回调</text>
<text x="286.0" y="170.0" font-size="9.4" fill="#1b2430" text-anchor="start" font-weight="normal">HMAC-SHA256</text>
<text x="286.0" y="182.9" font-size="9.4" fill="#1b2430" text-anchor="start" font-weight="normal">timestamp.body</text>
<text x="286.0" y="195.8" font-size="9.4" fill="#1b2430" text-anchor="start" font-weight="normal">±300 s</text>
<text x="372.0" y="262.0" font-size="9.0" fill="#5b6776" text-anchor="start" font-weight="normal">共享同一个 HMAC 密钥（P3：建议</text>
<text x="372.0" y="274.5" font-size="9.0" fill="#5b6776" text-anchor="start" font-weight="normal">在签名基串中加入方向标签）</text>
</svg>
