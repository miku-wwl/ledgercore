<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="12.0" y="19.0" font-size="13" fill="#1b2430" text-anchor="start" font-weight="600">账户方向：借方正常的资产与贷方正常的负债，以及恒等式 R + T = D + P</text>
<rect x="10.0" y="32.0" width="300.0" height="224.0" rx="7" fill="#f0f8f6" stroke="#a9d6cd" stroke-width="1"/>
<text x="19.0" y="47.0" font-size="10" fill="#0b4f48" text-anchor="start" font-weight="600">借方正常（资产，增加记借方）</text>
<rect x="22.0" y="60.0" width="276.0" height="50.0" rx="5.0" fill="#e8f5f2" stroke="#0f8a7e" stroke-width="1.2"/>
<text x="160.0" y="81.7" font-size="10.5" fill="#0b4f48" text-anchor="middle" font-weight="600">SIMULATION_RESERVE（R）</text>
<text x="160.0" y="95.8" font-size="10.0" fill="#0b4f48" text-anchor="middle" font-weight="normal">…0001 · 银行在清算中的结算准备金</text>
<rect x="22.0" y="122.0" width="276.0" height="50.0" rx="5.0" fill="#e8f5f2" stroke="#0f8a7e" stroke-width="1.2"/>
<text x="160.0" y="143.7" font-size="10.5" fill="#0b4f48" text-anchor="middle" font-weight="600">SIMULATION_TREASURY（T）</text>
<text x="160.0" y="157.8" font-size="10.0" fill="#0b4f48" text-anchor="middle" font-weight="normal">…0003 · V13 新增，仅流动性划转可用</text>
<rect x="22.0" y="184.0" width="276.0" height="60.0" rx="5.0" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.2"/>
<text x="160.0" y="210.8" font-size="10" fill="#1b2430" text-anchor="middle" font-weight="600">余额 = Σ借方 − Σ贷方</text>
<text x="160.0" y="224.4" font-size="9.5" fill="#1b2430" text-anchor="middle" font-weight="normal">准备金不能为负：结算被拒而不是透支</text>
<rect x="330.0" y="32.0" width="300.0" height="224.0" rx="7" fill="#fff8ee" stroke="#e6c69a" stroke-width="1"/>
<text x="339.0" y="47.0" font-size="10" fill="#6b3b05" text-anchor="start" font-weight="600">贷方正常（负债，增加记贷方）</text>
<rect x="342.0" y="60.0" width="276.0" height="50.0" rx="5.0" fill="#fff4e0" stroke="#d9730d" stroke-width="1.2"/>
<text x="480.0" y="81.7" font-size="10.5" fill="#6b3b05" text-anchor="middle" font-weight="600">CUSTOMER_DEPOSIT（D）</text>
<text x="480.0" y="95.8" font-size="10.0" fill="#6b3b05" text-anchor="middle" font-weight="normal">每个客户账户一个；开户注入 1,000.00</text>
<rect x="342.0" y="122.0" width="276.0" height="50.0" rx="5.0" fill="#fff4e0" stroke="#d9730d" stroke-width="1.2"/>
<text x="480.0" y="143.7" font-size="10.5" fill="#6b3b05" text-anchor="middle" font-weight="600">CLEARING_PAYABLE（P）</text>
<text x="480.0" y="157.8" font-size="10.0" fill="#6b3b05" text-anchor="middle" font-weight="normal">…0002 · 已记账、尚未结算的应付</text>
<rect x="342.0" y="184.0" width="276.0" height="60.0" rx="5.0" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.2"/>
<text x="480.0" y="210.8" font-size="10" fill="#1b2430" text-anchor="middle" font-weight="600">余额 = Σ贷方 − Σ借方</text>
<text x="480.0" y="224.4" font-size="9.5" fill="#1b2430" text-anchor="middle" font-weight="normal">客户存款是银行欠客户的钱</text>
<rect x="10.0" y="266.0" width="620.0" height="56.0" rx="5.0" fill="#0b2545" stroke="#0b2545" stroke-width="1.2"/>
<text x="320.0" y="290.7" font-size="10.5" fill="#ffffff" text-anchor="middle" font-weight="600">每张分录借贷相等 ⇒ 全账簿：Σ借方正常余额 = Σ贷方正常余额，即 R + T = D + P</text>
<text x="320.0" y="304.8" font-size="10.0" fill="#ffffff" text-anchor="middle" font-weight="normal">记账 Dr D / Cr P；结算 Dr P / Cr R；退款 Dr P / Cr D；流动性划转 Dr 收方资产 / Cr 付方资产</text>
</svg>
