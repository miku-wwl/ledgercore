<text x="320.0" y="270.0" font-size="10" fill="#5c4a00" text-anchor="middle" font-weight="600">E3 H03：500 项批次 1/10/30/50 个执行器，中位数 112.50/148.46/153.74/150.41 项/秒；24 组场景 0 重复转账、0 死锁</text>
<text x="320.0" y="283.6" font-size="9.5" fill="#5c4a00" text-anchor="middle" font-weight="normal">R4：执行器在失败项回滚之后、记录 FAILED 之前被杀死（E6 payroll-mark-failure-crash），</text>
<text x="320.0" y="297.2" font-size="9.5" fill="#5c4a00" text-anchor="middle" font-weight="normal">重启后失败只记一次、第 3 项付一次、第 1 项不重付：付款方 −4.00、收款方 +4.00</text>
