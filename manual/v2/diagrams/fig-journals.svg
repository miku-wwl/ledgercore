<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 318" width="640" height="318" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="12.0" y="19.0" font-size="13" fill="#1b2430" text-anchor="start" font-weight="600">记账、结算、退款与流动性划转：四种分录的借贷方</text>
<rect x="12.0" y="38.0" width="196.0" height="58.0" rx="5.0" fill="#eaf2fb" stroke="#3d7cc9" stroke-width="1.2"/>
<text x="110.0" y="63.9" font-size="9.6" fill="#1b2430" text-anchor="middle" font-weight="600">记账（批准时）</text>
<text x="110.0" y="77.1" font-size="9.1" fill="#1b2430" text-anchor="middle" font-weight="normal">corporate-payment:&lt;id&gt;:booking</text>
<rect x="216.0" y="38.0" width="150.0" height="28.0" rx="5.0" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.2"/>
<text x="291.0" y="55.4" font-size="9.4" fill="#1b2430" text-anchor="middle" font-weight="normal">Dr CUSTOMER_DEPOSIT</text>
<rect x="216.0" y="68.0" width="150.0" height="28.0" rx="5.0" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.2"/>
<text x="291.0" y="85.4" font-size="9.4" fill="#1b2430" text-anchor="middle" font-weight="normal">Cr CLEARING_PAYABLE</text>
<rect x="374.0" y="38.0" width="254.0" height="58.0" rx="5.0" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.2"/>
<text x="501.0" y="70.4" font-size="9.4" fill="#1b2430" text-anchor="middle" font-weight="normal">客户的钱离开存款，成为银行欠清算系统的应付</text>
<rect x="12.0" y="104.0" width="196.0" height="58.0" rx="5.0" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.2"/>
<text x="110.0" y="129.9" font-size="9.6" fill="#1d5c38" text-anchor="middle" font-weight="600">结算（SETTLED）</text>
<text x="110.0" y="143.1" font-size="9.1" fill="#1d5c38" text-anchor="middle" font-weight="normal">corporate-payment:&lt;id&gt;:settlement</text>
<rect x="216.0" y="104.0" width="150.0" height="28.0" rx="5.0" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.2"/>
<text x="291.0" y="121.4" font-size="9.4" fill="#1b2430" text-anchor="middle" font-weight="normal">Dr CLEARING_PAYABLE</text>
<rect x="216.0" y="134.0" width="150.0" height="28.0" rx="5.0" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.2"/>
<text x="291.0" y="151.4" font-size="9.4" fill="#1b2430" text-anchor="middle" font-weight="normal">Cr SIMULATION_RESERVE</text>
<rect x="374.0" y="104.0" width="254.0" height="58.0" rx="5.0" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.2"/>
<text x="501.0" y="136.4" font-size="9.4" fill="#1b2430" text-anchor="middle" font-weight="normal">应付清零，准备金减少；不足则拒绝</text>
<rect x="12.0" y="170.0" width="196.0" height="58.0" rx="5.0" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
<text x="110.0" y="195.9" font-size="9.6" fill="#7a1f16" text-anchor="middle" font-weight="600">退款（REJECTED）</text>
<text x="110.0" y="209.1" font-size="9.1" fill="#7a1f16" text-anchor="middle" font-weight="normal">corporate-payment:&lt;id&gt;:refund</text>
<rect x="216.0" y="170.0" width="150.0" height="28.0" rx="5.0" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.2"/>
<text x="291.0" y="187.4" font-size="9.4" fill="#1b2430" text-anchor="middle" font-weight="normal">Dr CLEARING_PAYABLE</text>
<rect x="216.0" y="200.0" width="150.0" height="28.0" rx="5.0" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.2"/>
<text x="291.0" y="217.4" font-size="9.4" fill="#1b2430" text-anchor="middle" font-weight="normal">Cr CUSTOMER_DEPOSIT</text>
<rect x="374.0" y="170.0" width="254.0" height="58.0" rx="5.0" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.2"/>
<text x="501.0" y="202.4" font-size="9.4" fill="#1b2430" text-anchor="middle" font-weight="normal">仅当没有结算时；钱回到客户存款</text>
<rect x="12.0" y="236.0" width="196.0" height="58.0" rx="5.0" fill="#fff4e0" stroke="#d9730d" stroke-width="1.2"/>
<text x="110.0" y="261.9" font-size="9.6" fill="#6b3b05" text-anchor="middle" font-weight="600">流动性划转</text>
<text x="110.0" y="275.1" font-size="9.1" fill="#6b3b05" text-anchor="middle" font-weight="normal">reserve-liquidity:&lt;uuid&gt;:OUT|IN</text>
<rect x="216.0" y="236.0" width="150.0" height="28.0" rx="5.0" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.2"/>
<text x="291.0" y="253.4" font-size="9.4" fill="#1b2430" text-anchor="middle" font-weight="normal">Dr 收方资产</text>
<rect x="216.0" y="266.0" width="150.0" height="28.0" rx="5.0" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.2"/>
<text x="291.0" y="283.4" font-size="9.4" fill="#1b2430" text-anchor="middle" font-weight="normal">Cr 付方资产</text>
<rect x="374.0" y="236.0" width="254.0" height="58.0" rx="5.0" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.2"/>
<text x="501.0" y="268.4" font-size="9.4" fill="#1b2430" text-anchor="middle" font-weight="normal">仅实验命令；R 与 T 之间平衡移动</text>
<text x="14.0" y="312.0" font-size="9.2" fill="#5b6776" text-anchor="start" font-weight="normal">每种分录恰好两行过账、金额相等；V8/V13 约束触发器核对引用格式、账户种类与付款状态。</text>
