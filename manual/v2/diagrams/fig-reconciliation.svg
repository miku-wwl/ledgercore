<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="12.0" y="19.0" font-size="13" fill="#1b2430" text-anchor="start" font-weight="600">对账控制流：独立查询 → 发现 → 例外（去重、升级）→ 复核后才能关闭</text>
<rect x="12.0" y="40.0" width="190.0" height="120.0" rx="5.0" fill="#e8f5f2" stroke="#0f8a7e" stroke-width="1.2"/>
<text x="107.0" y="70.0" font-size="9.8" fill="#0b4f48" text-anchor="middle" font-weight="600">ReconciliationQueryService</text>
<text x="107.0" y="83.4" font-size="9.3" fill="#0b4f48" text-anchor="middle" font-weight="normal">只读、按组织取数</text>
<text x="107.0" y="96.8" font-size="9.3" fill="#0b4f48" text-anchor="middle" font-weight="normal">过账 vs 投影</text>
<text x="107.0" y="110.2" font-size="9.3" fill="#0b4f48" text-anchor="middle" font-weight="normal">转账 vs 回执</text>
<text x="107.0" y="123.6" font-size="9.3" fill="#0b4f48" text-anchor="middle" font-weight="normal">付款 vs 分录 vs 外部状态</text>
<text x="107.0" y="137.0" font-size="9.3" fill="#0b4f48" text-anchor="middle" font-weight="normal">工资结果 vs 转账</text>
<rect x="226.0" y="40.0" width="190.0" height="120.0" rx="5.0" fill="#fff4e0" stroke="#d9730d" stroke-width="1.2"/>
<text x="321.0" y="76.7" font-size="9.8" fill="#6b3b05" text-anchor="middle" font-weight="600">发现（finding）</text>
<text x="321.0" y="90.1" font-size="9.3" fill="#6b3b05" text-anchor="middle" font-weight="normal">类别、严重度、</text>
<text x="321.0" y="103.5" font-size="9.3" fill="#6b3b05" text-anchor="middle" font-weight="normal">expected / observed 事实</text>
<text x="321.0" y="116.9" font-size="9.3" fill="#6b3b05" text-anchor="middle" font-weight="normal">operationId</text>
<text x="321.0" y="130.3" font-size="9.3" fill="#6b3b05" text-anchor="middle" font-weight="normal">模拟器类别：签名询价比对</text>
<rect x="440.0" y="40.0" width="188.0" height="120.0" rx="5.0" fill="#eaf2fb" stroke="#3d7cc9" stroke-width="1.2"/>
<text x="534.0" y="76.7" font-size="9.8" fill="#1b2430" text-anchor="middle" font-weight="600">reconciliation_exceptions</text>
<text x="534.0" y="90.1" font-size="9.3" fill="#1b2430" text-anchor="middle" font-weight="normal">同一异常只有一条未关闭</text>
<text x="534.0" y="103.5" font-size="9.3" fill="#1b2430" text-anchor="middle" font-weight="normal">严重度只升不降</text>
<text x="534.0" y="116.9" font-size="9.3" fill="#1b2430" text-anchor="middle" font-weight="normal">（审计 …_ESCALATED）</text>
<text x="534.0" y="130.3" font-size="9.3" fill="#1b2430" text-anchor="middle" font-weight="normal">不跨组织可见</text>
<polyline points="202.0,100.0 221.0,100.0" fill="none" stroke="#5b6776" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="226.0,100.0 217.1,96.0 217.1,104.0" fill="#5b6776"/>
<polyline points="416.0,100.0 435.0,100.0" fill="none" stroke="#5b6776" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="440.0,100.0 431.1,96.0 431.1,104.0" fill="#5b6776"/>
<rect x="409.3" y="86.5" width="37.4" height="13.5" fill="#ffffff" stroke="none" stroke-width="1" rx="2" opacity="0.86"/>
<text x="428.0" y="95.0" font-size="9.5" fill="#5b6776" text-anchor="middle" font-weight="normal">upsert</text>
<rect x="12.0" y="180.0" width="616.0" height="66.0" rx="5.0" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.2"/>
<text x="320.0" y="203.1" font-size="9.8" fill="#1d5c38" text-anchor="middle" font-weight="600">关闭（resolve）= 重新检查，而不是写一句备注</text>
<text x="320.0" y="216.5" font-size="9.3" fill="#1d5c38" text-anchor="middle" font-weight="normal">STATE_DERIVED（含 CLEARING_FINANCIAL_EFFECT_PENDING、CLEARING_INSTRUCTION_NOT_DISPATCHED）：重跑 inspect</text>
<text x="320.0" y="229.9" font-size="9.3" fill="#1d5c38" text-anchor="middle" font-weight="normal">SIMULATOR_DERIVED：签名询价 + compareClearing；CLEARING_RESERVE_INSUFFICIENT：付款必须已 COMPLETED 且无欠效果</text>
<rect x="12.0" y="258.0" width="616.0" height="62.0" rx="5.0" fill="#fffbe6" stroke="#d4b106" stroke-width="1.2"/>
<text x="320.0" y="285.8" font-size="9.8" fill="#5c4a00" text-anchor="middle" font-weight="600">复核失败 → 409，例外保持 OPEN；复核通过 → 记录 resolution、correction、category、severity 与 recheck 证据</text>
<text x="320.0" y="299.2" font-size="9.3" fill="#5c4a00" text-anchor="middle" font-weight="normal">对账代码从不改写历史；修复投影漂移只能从不可变过账重算（第 20 章）</text>
</svg>
