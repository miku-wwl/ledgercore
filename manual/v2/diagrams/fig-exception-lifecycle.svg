<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="12.0" y="19.0" font-size="13" fill="#1b2430" text-anchor="start" font-weight="600">例外的归属与生命周期</text>
<rect x="12.0" y="60.0" width="130.0" height="50.0" rx="5.0" fill="#fff4e0" stroke="#d9730d" stroke-width="1.2"/>
<text x="77.0" y="81.7" font-size="10.5" fill="#6b3b05" text-anchor="middle" font-weight="600">OPEN</text>
<text x="77.0" y="95.8" font-size="10.0" fill="#6b3b05" text-anchor="middle" font-weight="normal">发现即创建</text>
<rect x="196.0" y="60.0" width="130.0" height="50.0" rx="5.0" fill="#eaf2fb" stroke="#3d7cc9" stroke-width="1.2"/>
<text x="261.0" y="81.7" font-size="10.5" fill="#1b2430" text-anchor="middle" font-weight="600">ASSIGNED</text>
<text x="261.0" y="95.8" font-size="10.0" fill="#1b2430" text-anchor="middle" font-weight="normal">指派给运营成员</text>
<rect x="380.0" y="60.0" width="130.0" height="50.0" rx="5.0" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.2"/>
<text x="445.0" y="81.7" font-size="10.5" fill="#1d5c38" text-anchor="middle" font-weight="600">RESOLVED</text>
<text x="445.0" y="95.8" font-size="10.0" fill="#1d5c38" text-anchor="middle" font-weight="normal">复核通过后</text>
<polyline points="142.0,85.0 191.0,85.0" fill="none" stroke="#5b6776" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="196.0,85.0 187.1,81.0 187.1,89.0" fill="#5b6776"/>
<rect x="150.3" y="71.5" width="37.4" height="13.5" fill="#ffffff" stroke="none" stroke-width="1" rx="2" opacity="0.86"/>
<text x="169.0" y="80.0" font-size="9.5" fill="#5b6776" text-anchor="middle" font-weight="normal">assign</text>
<polyline points="326.0,85.0 375.0,85.0" fill="none" stroke="#5b6776" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="380.0,85.0 371.1,81.0 371.1,89.0" fill="#5b6776"/>
<rect x="331.7" y="71.5" width="42.6" height="13.5" fill="#ffffff" stroke="none" stroke-width="1" rx="2" opacity="0.86"/>
<text x="353.0" y="80.0" font-size="9.5" fill="#5b6776" text-anchor="middle" font-weight="normal">resolve</text>
<polyline points="77.0,60.0 77.0,40.0 445.0,40.0 445.0,55.0" fill="none" stroke="#5b6776" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 4"/>
<polygon points="445.0,60.0 449.0,51.1 441.0,51.1" fill="#5b6776"/>
<rect x="206.5" y="26.5" width="109.1" height="13.5" fill="#ffffff" stroke="none" stroke-width="1" rx="2" opacity="0.86"/>
<text x="261.0" y="35.0" font-size="9.5" fill="#5b6776" text-anchor="middle" font-weight="normal">resolve（同样先复核）</text>
<rect x="530.0" y="52.0" width="98.0" height="66.0" rx="5.0" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
<text x="579.0" y="75.0" font-size="10" fill="#7a1f16" text-anchor="middle" font-weight="600">复核失败</text>
<text x="579.0" y="88.6" font-size="9.5" fill="#7a1f16" text-anchor="middle" font-weight="normal">409</text>
<text x="579.0" y="102.2" font-size="9.5" fill="#7a1f16" text-anchor="middle" font-weight="normal">状态不变</text>
<rect x="12.0" y="136.0" width="616.0" height="102.0" rx="5.0" fill="#e8f5f2" stroke="#0f8a7e" stroke-width="1.2"/>
<text x="320.0" y="170.2" font-size="10" fill="#0b4f48" text-anchor="middle" font-weight="600">谁能做什么（E8 矩阵逐格执行）</text>
<text x="320.0" y="183.8" font-size="9.5" fill="#0b4f48" text-anchor="middle" font-weight="normal">只有该组织的 OPERATIONS 成员能查看、指派、解决、询价、重试；其它成员 403，非成员与其它组织 404</text>
<text x="320.0" y="197.4" font-size="9.5" fill="#0b4f48" text-anchor="middle" font-weight="normal">每次解决都写审计：actor、resolution、correction、recheck 证据；并发的对账运行只保留一条未关闭例外</text>
<text x="320.0" y="211.0" font-size="9.5" fill="#0b4f48" text-anchor="middle" font-weight="normal">CRITICAL 例外无法通过点击“Resolve”消失：复核仍欠就失败（R4-03）</text>
</svg>
