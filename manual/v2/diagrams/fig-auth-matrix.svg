<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 306" width="640" height="306" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="12.0" y="19.0" font-size="13" fill="#1b2430" text-anchor="start" font-weight="600">E8：执行过的角色 × 路由 × 对象矩阵（12 个主体 × 44 条路由 = 528 格）</text>
<rect x="12.0" y="38.0" width="148.0" height="32.0" rx="5.0" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.2"/>
<text x="86.0" y="57.5" font-size="9.6" fill="#1b2430" text-anchor="middle" font-weight="normal">ANONYMOUS</text>
