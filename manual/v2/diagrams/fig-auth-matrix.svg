<text x="242.0" y="57.5" font-size="9.6" fill="#1b2430" text-anchor="middle" font-weight="normal">PERSONAL_CUSTOMER</text>
<rect x="324.0" y="38.0" width="148.0" height="32.0" rx="5.0" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.2"/>
<text x="398.0" y="57.5" font-size="9.6" fill="#1b2430" text-anchor="middle" font-weight="normal">ORG_ADMIN</text>
<rect x="480.0" y="38.0" width="148.0" height="32.0" rx="5.0" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.2"/>
<text x="554.0" y="57.5" font-size="9.6" fill="#1b2430" text-anchor="middle" font-weight="normal">PAYMENT_MAKER</text>
<rect x="12.0" y="78.0" width="148.0" height="32.0" rx="5.0" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.2"/>
<text x="86.0" y="97.5" font-size="9.6" fill="#1b2430" text-anchor="middle" font-weight="normal">PAYMENT_APPROVER</text>
<rect x="168.0" y="78.0" width="148.0" height="32.0" rx="5.0" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.2"/>
<text x="242.0" y="97.5" font-size="9.6" fill="#1b2430" text-anchor="middle" font-weight="normal">PAYROLL_MAKER</text>
<rect x="324.0" y="78.0" width="148.0" height="32.0" rx="5.0" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.2"/>
<text x="398.0" y="97.5" font-size="9.6" fill="#1b2430" text-anchor="middle" font-weight="normal">PAYROLL_APPROVER</text>
<rect x="480.0" y="78.0" width="148.0" height="32.0" rx="5.0" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.2"/>
<text x="554.0" y="97.5" font-size="9.6" fill="#1b2430" text-anchor="middle" font-weight="normal">FINANCE_VIEWER</text>
<rect x="12.0" y="118.0" width="148.0" height="32.0" rx="5.0" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.2"/>
<text x="86.0" y="137.5" font-size="9.6" fill="#1b2430" text-anchor="middle" font-weight="normal">OPERATIONS</text>
<rect x="168.0" y="118.0" width="148.0" height="32.0" rx="5.0" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.2"/>
<text x="242.0" y="137.5" font-size="9.6" fill="#1b2430" text-anchor="middle" font-weight="normal">SUSPENDED_MEMBER</text>
<rect x="324.0" y="118.0" width="148.0" height="32.0" rx="5.0" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.2"/>
<text x="398.0" y="137.5" font-size="9.6" fill="#1b2430" text-anchor="middle" font-weight="normal">CROSS_TENANT_ADMIN</text>
<rect x="480.0" y="118.0" width="148.0" height="32.0" rx="5.0" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.2"/>
<text x="554.0" y="137.5" font-size="9.6" fill="#1b2430" text-anchor="middle" font-weight="normal">SUSPENDED_ORG_ADMIN</text>
<rect x="12.0" y="162.0" width="302.0" height="64.0" rx="5.0" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.2"/>
<text x="163.0" y="184.0" font-size="10" fill="#1d5c38" text-anchor="middle" font-weight="600">每一格：真实 HTTP 请求 + CSRF</text>
<text x="163.0" y="197.6" font-size="9.5" fill="#1d5c38" text-anchor="middle" font-weight="normal">期望状态码与实际状态码逐一比对</text>
<text x="163.0" y="211.2" font-size="9.5" fill="#1d5c38" text-anchor="middle" font-weight="normal">0 个不一致</text>
<rect x="326.0" y="162.0" width="302.0" height="64.0" rx="5.0" fill="#eaf2fb" stroke="#3d7cc9" stroke-width="1.2"/>
<text x="477.0" y="184.0" font-size="10" fill="#1b2430" text-anchor="middle" font-weight="600">243 个被拒绝的变更请求</text>
<text x="477.0" y="197.6" font-size="9.5" fill="#1b2430" text-anchor="middle" font-weight="normal">事后用 SQL 核对：无分录、无状态变化、无事件</text>
<text x="477.0" y="211.2" font-size="9.5" fill="#1b2430" text-anchor="middle" font-weight="normal">拒绝必须没有副作用</text>
<rect x="12.0" y="236.0" width="616.0" height="60.0" rx="5.0" fill="#fffbe6" stroke="#d4b106" stroke-width="1.2"/>
<text x="320.0" y="262.8" font-size="10" fill="#5c4a00" text-anchor="middle" font-weight="600">另三项：缺 CSRF 的变更对每个已认证主体都被拒；同时持有 MAKER+APPROVER 也不能批准自己；</text>
<text x="320.0" y="276.4" font-size="9.5" fill="#5c4a00" text-anchor="middle" font-weight="normal">批准人在提交后被撤销角色，就无法再记账；矩阵结果写入 target/e8-authorization-matrix.json</text>
</svg>
