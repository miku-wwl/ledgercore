<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 326" width="640" height="326" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="12.0" y="19.0" font-size="13" fill="#1b2430" text-anchor="start" font-weight="600">Policy B：职责分离由服务端和数据库同时执行</text>
<rect x="12.0" y="40.0" width="150.0" height="58.0" rx="5.0" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.2"/>
<text x="87.0" y="58.7" font-size="10.5" fill="#1b2430" text-anchor="middle" font-weight="600">付款专员 A</text>
<text x="87.0" y="72.8" font-size="10.0" fill="#1b2430" text-anchor="middle" font-weight="normal">PAYMENT_MAKER</text>
<text x="87.0" y="86.9" font-size="10.0" fill="#1b2430" text-anchor="middle" font-weight="normal">创建、提交</text>
<rect x="196.0" y="40.0" width="160.0" height="58.0" rx="5.0" fill="#eaf2fb" stroke="#3d7cc9" stroke-width="1.2"/>
<text x="276.0" y="58.7" font-size="10.5" fill="#1b2430" text-anchor="middle" font-weight="600">SUBMITTED</text>
<text x="276.0" y="72.8" font-size="10.0" fill="#1b2430" text-anchor="middle" font-weight="normal">intent_digest 已保存</text>
<text x="276.0" y="86.9" font-size="10.0" fill="#1b2430" text-anchor="middle" font-weight="normal">内容不可再改</text>
<rect x="392.0" y="40.0" width="236.0" height="58.0" rx="5.0" fill="#e6f4ea" stroke="#2e8b57" stroke-width="1.2"/>
<text x="510.0" y="58.7" font-size="10.5" fill="#1d5c38" text-anchor="middle" font-weight="600">财务主管 B 批准</text>
<text x="510.0" y="72.8" font-size="10.0" fill="#1d5c38" text-anchor="middle" font-weight="normal">PAYMENT_APPROVER 且 B ≠ 提交者</text>
<text x="510.0" y="86.9" font-size="10.0" fill="#1d5c38" text-anchor="middle" font-weight="normal">摘要重新计算并比对</text>
<polyline points="162.0,69.0 191.0,69.0" fill="none" stroke="#5b6776" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="196.0,69.0 187.1,65.0 187.1,73.0" fill="#5b6776"/>
<rect x="160.3" y="55.5" width="37.4" height="13.5" fill="#ffffff" stroke="none" stroke-width="1" rx="2" opacity="0.86"/>
<text x="179.0" y="64.0" font-size="9.5" fill="#5b6776" text-anchor="middle" font-weight="normal">submit</text>
<polyline points="356.0,69.0 387.0,69.0" fill="none" stroke="#5b6776" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="392.0,69.0 383.1,65.0 383.1,73.0" fill="#5b6776"/>
<rect x="352.7" y="55.5" width="42.6" height="13.5" fill="#ffffff" stroke="none" stroke-width="1" rx="2" opacity="0.86"/>
<text x="374.0" y="64.0" font-size="9.5" fill="#5b6776" text-anchor="middle" font-weight="normal">approve</text>
<rect x="12.0" y="132.0" width="300.0" height="46.0" rx="5.0" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
<text x="162.0" y="151.8" font-size="10" fill="#7a1f16" text-anchor="middle" font-weight="600">A 批准自己的付款 → 403 PAYMENT_MAKER_CHECKER</text>
<text x="162.0" y="165.4" font-size="9.5" fill="#7a1f16" text-anchor="middle" font-weight="normal">即使 A 同时持有 MAKER 与 APPROVER 角色</text>
<rect x="328.0" y="132.0" width="300.0" height="46.0" rx="5.0" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
<text x="478.0" y="151.8" font-size="10" fill="#7a1f16" text-anchor="middle" font-weight="600">通用转账从企业账户扣款 → 409</text>
<text x="478.0" y="165.4" font-size="9.5" fill="#7a1f16" text-anchor="middle" font-weight="normal">CORPORATE_APPROVAL_REQUIRED（Policy B 守卫）</text>
<rect x="12.0" y="192.0" width="300.0" height="46.0" rx="5.0" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
<text x="162.0" y="211.8" font-size="10" fill="#7a1f16" text-anchor="middle" font-weight="600">管理员给自己授予角色 → 拒绝</text>
<text x="162.0" y="225.4" font-size="9.5" fill="#7a1f16" text-anchor="middle" font-weight="normal">“An administrator cannot grant roles…”</text>
<rect x="328.0" y="192.0" width="300.0" height="46.0" rx="5.0" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
<text x="478.0" y="211.8" font-size="10" fill="#7a1f16" text-anchor="middle" font-weight="600">批准后角色被撤销 → 无法再记账</text>
<text x="478.0" y="225.4" font-size="9.5" fill="#7a1f16" text-anchor="middle" font-weight="normal">每次请求按当前成员资格重新授权</text>
<rect x="12.0" y="254.0" width="616.0" height="62.0" rx="5.0" fill="#0b2545" stroke="#0b2545" stroke-width="1.2"/>
<text x="320.0" y="281.8" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">E8 实测矩阵：12 个主体 × 44 条路由 = 528 格，0 失败；243 个被拒绝的变更逐一核对“无副作用”</text>
<text x="320.0" y="295.4" font-size="9.5" fill="#ffffff" text-anchor="middle" font-weight="normal">非成员看到 404（隐藏组织存在），成员缺角色看到 403；组织或成员被暂停后立即失效</text>
</svg>
