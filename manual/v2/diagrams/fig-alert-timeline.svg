<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 282" width="640" height="282" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="12.0" y="19.0" font-size="13" fill="#1b2430" text-anchor="start" font-weight="600">E9 告警实验（Prometheus 3.13.3，2c25ef4）：两条告警各自的触发时刻与恢复</text>
<text x="14.0" y="87.0" font-size="10" fill="#1b2430" text-anchor="start" font-weight="600">准备金缺口告警</text>
<text x="14.0" y="100.0" font-size="7.4" fill="#5b6776" text-anchor="start" font-weight="normal">LedgerCoreClearingReserveShortfall</text>
<rect x="160.0" y="76.0" width="24.9" height="24.0" fill="#f9e1c4" stroke="none" stroke-width="1" rx="3"/>
<rect x="184.9" y="76.0" width="302.3" height="24.0" fill="#f6d3cf" stroke="none" stroke-width="1" rx="3"/>
<rect x="487.2" y="76.0" width="95.0" height="24.0" fill="#f6d3cf" stroke="none" stroke-width="1" rx="3" opacity="0.4"/>
<text x="188.9" y="92.0" font-size="9" fill="#7a1f16" text-anchor="start" font-weight="normal">+5.1 s 起 firing</text>
<text x="14.0" y="125.0" font-size="10" fill="#1b2430" text-anchor="start" font-weight="600">欠效果告警</text>
<text x="14.0" y="138.0" font-size="7.4" fill="#5b6776" text-anchor="start" font-weight="normal">LedgerCoreClearingEffectPending</text>
<rect x="160.0" y="114.0" width="320.3" height="24.0" fill="#f9e1c4" stroke="none" stroke-width="1" rx="3"/>
<rect x="480.3" y="114.0" width="6.9" height="24.0" fill="#f6d3cf" stroke="none" stroke-width="1" rx="3"/>
<rect x="487.2" y="114.0" width="95.0" height="24.0" fill="#f6d3cf" stroke="none" stroke-width="1" rx="3" opacity="0.4"/>
<text x="491.2" y="130.0" font-size="9" fill="#7a1f16" text-anchor="start" font-weight="normal">+65.1 s 起 firing</text>
<text x="320.1" y="130.0" font-size="9" fill="#1b2430" text-anchor="middle" font-weight="normal">最早欠效果未满 60 s：规则尚未满足</text>
<line x1="160.0" y1="156.0" x2="616.0" y2="156.0" stroke="#9aa5b1" stroke-width="1.2"/>
<line x1="160.0" y1="152.0" x2="160.0" y2="160.0" stroke="#9aa5b1" stroke-width="1.0"/>
<text x="160.0" y="174.0" font-size="9.5" fill="#5b6776" text-anchor="middle" font-weight="normal">0 s</text>
<line x1="258.4" y1="152.0" x2="258.4" y2="160.0" stroke="#9aa5b1" stroke-width="1.0"/>
<text x="258.4" y="174.0" font-size="9.5" fill="#5b6776" text-anchor="middle" font-weight="normal">20 s</text>
<line x1="356.9" y1="152.0" x2="356.9" y2="160.0" stroke="#9aa5b1" stroke-width="1.0"/>
<text x="356.9" y="174.0" font-size="9.5" fill="#5b6776" text-anchor="middle" font-weight="normal">40 s</text>
<line x1="455.3" y1="152.0" x2="455.3" y2="160.0" stroke="#9aa5b1" stroke-width="1.0"/>
<text x="455.3" y="174.0" font-size="9.5" fill="#5b6776" text-anchor="middle" font-weight="normal">60 s</text>
<line x1="553.8" y1="152.0" x2="553.8" y2="160.0" stroke="#9aa5b1" stroke-width="1.0"/>
<text x="553.8" y="174.0" font-size="9.5" fill="#5b6776" text-anchor="middle" font-weight="normal">80 s</text>
<text x="160.0" y="50.0" font-size="9.2" fill="#1b2430" text-anchor="start" font-weight="normal">0 s：准备金不足，结算被拒</text>
<text x="485.2" y="50.0" font-size="9.2" fill="#1b2430" text-anchor="end" font-weight="normal">+66.5 s 实验确认两条均 firing</text>
<text x="582.2" y="64.0" font-size="9.2" fill="#1b2430" text-anchor="end" font-weight="normal">+85.8 s 实验确认两条均已解除</text>
<line x1="160.0" y1="68.0" x2="160.0" y2="156.0" stroke="#1b2430" stroke-width="1.0" stroke-dasharray="3 3"/>
<line x1="487.2" y1="68.0" x2="487.2" y2="156.0" stroke="#1b2430" stroke-width="1.0" stroke-dasharray="3 3"/>
<line x1="582.2" y1="68.0" x2="582.2" y2="156.0" stroke="#1b2430" stroke-width="1.0" stroke-dasharray="3 3"/>
<text x="14.0" y="200.0" font-size="9.2" fill="#1b2430" text-anchor="start" font-weight="normal">缺口实测 3000 分（30.00 NZD），欠效果 1 笔；确认 firing 之后补足准备金，经一次受治理的死信重试结算恰好一次。</text>
<text x="14.0" y="216.0" font-size="9.2" fill="#1b2430" text-anchor="start" font-weight="normal">规则：reserve_shortfall_minor &gt; 0；effects_pending &gt; 0 且最早欠效果 &gt; 60 s；都没有等待期，也都没有客户或付款标签。</text>
<text x="14.0" y="232.0" font-size="9.2" fill="#1b2430" text-anchor="start" font-weight="normal">深色段：Prometheus 记录的 activeAt 起、到实验确认 firing 为止；浅色段：恢复动作进行中，两条告警在此期间解除，</text>
<text x="14.0" y="248.0" font-size="9.2" fill="#1b2430" text-anchor="start" font-weight="normal">各自的解除时刻没有单独记录。对照付款 1.23 NZD 先正常结算，期间无告警；通知投递（Alertmanager）不在范围内。</text>
</svg>
