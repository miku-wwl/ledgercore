name: LedgerCore CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ledgercore-main-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    name: Build, security, and full-stack acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: ledgercore_test
          POSTGRES_USER: ledgercore_ci
          POSTGRES_PASSWORD: ledgercore_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledgercore_ci -d ledgercore_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      LEDGERCORE_TEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/ledgercore_test
      LEDGERCORE_TEST_DB_USERNAME: ledgercore_ci
      LEDGERCORE_TEST_DB_PASSWORD: ledgercore_ci_password
      LEDGERCORE_DB_URL: jdbc:postgresql://127.0.0.1:5432/ledgercore_test
      LEDGERCORE_DB_USERNAME: ledgercore_ci
      LEDGERCORE_DB_PASSWORD: ledgercore_ci_password
      LEDGERCORE_COOKIE_SECURE: "false"
      CLEARING_SIMULATOR_TEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/ledgercore_simulator_test
      CLEARING_SIMULATOR_TEST_DB_USERNAME: ledgercore_ci
      CLEARING_SIMULATOR_TEST_DB_PASSWORD: ledgercore_ci_password

    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            backend/pom.xml
            clearing-simulator/pom.xml

      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Create isolated simulator database
        run: |
          postgres_container=$(docker ps --filter "ancestor=postgres:18" --format "{{.ID}}" | head -n 1)
          if [ -z "$postgres_container" ]; then
            echo "PostgreSQL service container was not found" >&2
            exit 1
          fi
          docker exec "$postgres_container" psql -U ledgercore_ci -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE ledgercore_simulator_test OWNER ledgercore_ci"

      - name: Check JavaScript dependencies
        working-directory: frontend
        run: npm audit --registry=https://registry.npmjs.org --audit-level=high

      - name: Lint and build frontend
        working-directory: frontend
        run: |
          npm run lint
          npm run build

      - name: Verify backend, integration tests, and architecture rules
        run: ./backend/mvnw --batch-mode --no-transfer-progress -f backend/pom.xml clean verify

      - name: Verify independent clearing simulator and PostgreSQL tests
        run: ./backend/mvnw --batch-mode --no-transfer-progress -f clearing-simulator/pom.xml clean verify

      - name: Start application for API contract and browser checks
        shell: bash
        env:
          LEDGERCORE_CLEARING_ENABLED: "true"
          LEDGERCORE_CLEARING_HMAC_SECRET: ci-contract-only-secret-with-32-bytes
        run: |
          java -jar backend/target/ledgercore-0.0.1-SNAPSHOT.jar --server.port=8080 > "$RUNNER_TEMP/ledgercore.log" 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8080/actuator/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/ledgercore.log"
          exit 1

      - name: Verify generated OpenAPI TypeScript contract
        working-directory: frontend
        run: |
          npm run generate:api
          git diff --exit-code -- src/api/schema.d.ts

      - name: Install Chromium for Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run full-stack browser acceptance
        working-directory: frontend
        env:
          CI: "true"
        run: npm run test:e2e

  dependency-scan:
    if: github.ref == 'refs/heads/main'
    name: Scan Maven dependency vulnerabilities
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932
    with:
      scan-args: |-
        --data-source=native
        --maven-registry=https://repo.maven.apache.org/maven2/
        --lockfile=backend/pom.xml
        --lockfile=clearing-simulator/pom.xml
    permissions:
      actions: read
      contents: read
      security-events: write
