# Tests write financial fixtures and install failure-injection triggers, so the datasource must always be an
# explicitly chosen disposable database. There is deliberately no default URL (R2-13): an unset
# LEDGERCORE_TEST_DB_URL fails fast instead of connecting to a persistent local service.
spring.datasource.url=${LEDGERCORE_TEST_DB_URL}
spring.datasource.username=${LEDGERCORE_TEST_DB_USERNAME:ledgercore_test}
spring.datasource.password=${LEDGERCORE_TEST_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.clean-disabled=true
server.servlet.session.cookie.secure=false
