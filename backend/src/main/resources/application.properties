spring.application.name=LedgerCore
logging.structured.format.console=logstash

# Override these values through the environment for local or hosted databases.
spring.datasource.url=${LEDGERCORE_DB_URL:jdbc:postgresql://localhost:5432/ledgercore}
spring.datasource.username=${LEDGERCORE_DB_USERNAME:ledgercore}
spring.datasource.password=${LEDGERCORE_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info,prometheus,ledgercore
management.endpoint.health.show-details=never
management.prometheus.metrics.export.enabled=true

ledgercore.observability.refresh-ms=${LEDGERCORE_OBSERVABILITY_REFRESH_MS:5000}

server.error.include-message=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${LEDGERCORE_COOKIE_SECURE:true}

springdoc.swagger-ui.path=/swagger-ui.html

ledgercore.clearing.enabled=${LEDGERCORE_CLEARING_ENABLED:false}
ledgercore.clearing.shared-secret=${LEDGERCORE_CLEARING_HMAC_SECRET:}
ledgercore.clearing.simulator-url=${LEDGERCORE_CLEARING_SIMULATOR_URL:http://127.0.0.1:8091}
ledgercore.clearing.timestamp-skew-seconds=${LEDGERCORE_CLEARING_TIMESTAMP_SKEW_SECONDS:300}
