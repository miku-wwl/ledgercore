spring.application.name=LedgerCore

# Override these values through the environment for local or hosted databases.
spring.datasource.url=${LEDGERCORE_DB_URL:jdbc:postgresql://localhost:5432/ledgercore}
spring.datasource.username=${LEDGERCORE_DB_USERNAME:ledgercore}
spring.datasource.password=${LEDGERCORE_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

server.error.include-message=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${LEDGERCORE_COOKIE_SECURE:false}

springdoc.swagger-ui.path=/swagger-ui.html
