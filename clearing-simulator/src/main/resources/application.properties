spring.application.name=LedgerCore Clearing Simulator
logging.structured.format.console=logstash
spring.datasource.url=${CLEARING_SIMULATOR_DB_URL}
spring.datasource.username=${CLEARING_SIMULATOR_DB_USERNAME}
spring.datasource.password=${CLEARING_SIMULATOR_DB_PASSWORD:}
spring.flyway.enabled=true
spring.jpa.open-in-view=false
server.port=${CLEARING_SIMULATOR_PORT:8091}
server.error.include-message=never

ledgercore.clearing.shared-secret=${LEDGERCORE_CLEARING_HMAC_SECRET}
ledgercore.clearing.bank-callback-url=${LEDGERCORE_BANK_CALLBACK_URL:http://127.0.0.1:8080/api/clearing/callbacks}
ledgercore.clearing.timestamp-skew-seconds=${LEDGERCORE_CLEARING_TIMESTAMP_SKEW_SECONDS:300}
ledgercore.clearing.poll-ms=${CLEARING_SIMULATOR_POLL_MS:250}
ledgercore.clearing.callback-dispatch-enabled=${CLEARING_SIMULATOR_CALLBACK_DISPATCH_ENABLED:true}
